<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} - haruka</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <main class="max-w-xl mx-auto px-4 py-16">
    <section class="bg-white rounded-lg border border-red-200 p-5">
      <div class="text-sm font-medium text-red-700">{{ title }}（HTTP {{ status }}）</div>
      <p class="text-sm text-gray-600 mt-2">错误详情如下：</p>
      <pre data-error-detail class="mt-3 p-3 rounded bg-gray-900 text-red-200 text-xs whitespace-pre-wrap break-words overflow-auto">{{ message }}</pre>
      <div class="flex gap-3 mt-5">
        <a href="/dashboard" class="bg-blue-600 text-white text-sm px-4 py-1.5 rounded hover:bg-blue-700">返回仪表板</a>
        <a href="/unlock" class="text-sm text-gray-600 px-4 py-1.5 rounded border border-gray-300 hover:bg-gray-50">重新解锁</a>
      </div>
    </section>
  </main>
</body>
</html>
