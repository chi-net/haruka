{% extends "base.html" %}
{% block title %}{{ heading }} - haruka{% endblock %}
{% block content %}
<h1 class="text-xl font-bold mb-4">{{ heading }}</h1>
<form method="post" action="{{ action }}" class="bg-white rounded-lg border border-gray-200 p-4 space-y-4 max-w-md">
  <div>
    <label class="block text-sm text-gray-600 mb-1">账户名称</label>
    <input name="name" value="{{ name }}" required class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
  </div>
  <div>
    <label class="block text-sm text-gray-600 mb-1">账户类型</label>
    <select id="account-kind" name="account_kind" class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
      <option value="payment" {% if account_kind == "payment" %}selected{% endif %}>支付账户</option>
      <option value="bank" {% if account_kind == "bank" %}selected{% endif %}>银行账户</option>
      <option value="stored_value" {% if account_kind == "stored_value" %}selected{% endif %}>储值卡账户</option>
      <option value="credit_card" {% if account_kind == "credit_card" %}selected{% endif %}>信用卡</option>
      <option value="credit_service" {% if account_kind == "credit_service" %}selected{% endif %}>信贷服务</option>
      <option value="investment" {% if account_kind == "investment" %}selected{% endif %}>投资账户</option>
      <option value="other" {% if account_kind == "other" %}selected{% endif %}>其他</option>
    </select>
  </div>
  <div>
    <label class="block text-sm text-gray-600 mb-1">账户货币</label>
    <select name="currency" required class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
      {% for c in currencies %}<option value="{{ c.code }}" {% if c.code == currency %}selected{% endif %}>{{ c.code }} · {{ c.name }}</option>{% endfor %}
    </select>
    <p class="text-xs text-gray-400 mt-1">已有余额或流水后不可直接改币种，避免历史金额被重新解释。</p>
  </div>
  <div id="card-number-field">
    <label class="block text-sm text-gray-600 mb-1">卡号（可选）</label>
    <input name="card_number" value="{{ card_number }}" autocomplete="off" spellcheck="false" placeholder="例如：6222 0000 0000 1234" class="w-full border border-gray-300 rounded px-3 py-1.5 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    <p class="text-xs text-gray-400 mt-1">银行、储值卡和信用卡可填写，列表中仅显示后四位。</p>
  </div>
  <div id="account-username-field">
    <label class="block text-sm text-gray-600 mb-1">账户用户名（可选）</label>
    <input name="account_username" value="{{ account_username }}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="例如：haruka_user" class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    <p class="text-xs text-gray-400 mt-1">支付账户和信贷服务可填写，列表中显示前三位和后两位。</p>
  </div>
  <div id="credit-settings-field" class="grid grid-cols-2 gap-3">
    <div>
      <label class="block text-sm text-gray-600 mb-1">授信额</label>
      <input id="credit-limit" name="credit_limit" type="number" step="0.01" min="0.01" value="{{ credit_limit }}" placeholder="10000.00" class="w-full border border-gray-300 rounded px-3 py-1.5 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm text-gray-600 mb-1">账单日</label>
      <input id="billing-day" name="billing_day" type="number" min="1" max="31" value="{{ billing_day }}" placeholder="例如：5" class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
  </div>
  <div>
    <label class="block text-sm text-gray-600 mb-1">备注</label>
    <input name="note" value="{{ note }}" class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
  </div>
  <div class="flex gap-3">
    <button type="submit" class="bg-blue-600 text-white text-sm px-4 py-1.5 rounded hover:bg-blue-700">保存</button>
    <a href="/accounts" class="text-sm text-gray-600 px-4 py-1.5 rounded border border-gray-300 hover:bg-gray-50">取消</a>
  </div>
</form>
<script>
(() => {
  const select = document.getElementById('account-kind');
  const card = document.getElementById('card-number-field');
  const username = document.getElementById('account-username-field');
  const credit = document.getElementById('credit-settings-field');
  const creditLimit = document.getElementById('credit-limit');
  const billingDay = document.getElementById('billing-day');
  const updateFields = () => {
    const isCredit = select.value === 'credit_card' || select.value === 'credit_service';
    card.classList.toggle('hidden', select.value !== 'bank' && select.value !== 'stored_value' && select.value !== 'credit_card');
    username.classList.toggle('hidden', select.value !== 'payment' && select.value !== 'credit_service');
    credit.classList.toggle('hidden', !isCredit);
    creditLimit.required = isCredit;
    billingDay.required = isCredit;
  };
  select.addEventListener('change', updateFields);
  updateFields();
})();
</script>
{% endblock %}
