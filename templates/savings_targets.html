{% extends "base.html" %}
{% block title %}补齐攒钱目标 - Haruka{% endblock %}
{% block content %}
<div class="mb-4 flex flex-wrap items-center justify-between gap-3">
  <div>
    <h1 class="text-xl font-bold">补齐攒钱目标</h1>
    <p class="mt-1 text-sm text-gray-500">历史项目缺少目标金额。目标金额与附属账户余额独立，只用于展示目标进度；本次只要求补填一次。</p>
  </div>
  <a href="/savings" class="text-sm text-blue-600 hover:underline">返回攒钱</a>
</div>
{% if rows.is_empty() %}
<section class="rounded-lg border border-green-200 bg-green-50 p-4 text-sm text-green-800">所有攒钱项目都已设置目标金额，无需迁移。</section>
{% else %}
<form method="post" action="/savings/targets" class="max-w-2xl space-y-4 rounded-lg border border-gray-200 bg-white p-5">
  {% for row in rows %}
  <div>
    <label class="mb-1 block text-sm text-gray-600">{{ row.name }}</label>
    <input name="target_{{ row.id }}" type="number" min="0.01" step="0.01" required value="{{ row.target }}" class="w-full rounded border px-3 py-2 text-sm font-mono" placeholder="填写目标金额">
  </div>
  {% endfor %}
  <button class="rounded bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">保存目标金额</button>
</form>
{% endif %}
{% endblock %}
