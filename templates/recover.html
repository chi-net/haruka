{% extends "base.html" %}
{% block title %}恢复访问 - haruka{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12">
  <h1 class="text-xl font-bold mb-2">使用助记词恢复</h1>
  <p class="text-sm text-gray-500 mb-4">输入原始顺序的 12 个英文单词，并设置新的主密码。</p>
  {% if !error.is_empty() %}
  <p class="text-sm text-red-600 mb-4">{{ error }}</p>
  {% endif %}
  <form method="post" action="/recover" class="bg-white rounded-lg border border-gray-200 p-4 space-y-4">
    <div>
      <label class="block text-sm text-gray-600 mb-1">恢复助记词</label>
      <textarea name="mnemonic" required rows="4" autocomplete="off" autocapitalize="none" spellcheck="false" class="w-full border border-gray-300 rounded px-3 py-2 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>
    <div>
      <label class="block text-sm text-gray-600 mb-1">新主密码（至少 6 位）</label>
      <input name="password" type="password" required minlength="6" autocomplete="new-password" class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm text-gray-600 mb-1">确认新主密码</label>
      <input name="confirm" type="password" required autocomplete="new-password" class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <button type="submit" class="w-full bg-blue-600 text-white text-sm px-4 py-1.5 rounded hover:bg-blue-700">恢复并重设密码</button>
  </form>
  <p class="text-center mt-4"><a href="/unlock" class="text-sm text-blue-600 hover:underline">返回密码解锁</a></p>
</div>
{% endblock %}
