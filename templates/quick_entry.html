<section id="quick-entry" class="bg-white rounded-lg border border-gray-200 p-4 mb-5">
  <div class="mb-4"><h2 class="font-medium">{{ quick_entry_heading }}</h2><p class="text-xs text-gray-500 mt-1">收入、支出、转账和借还都从这里记录。</p></div>
  <div class="flex rounded border border-gray-200 overflow-hidden w-fit mb-4">
    <button type="button" data-panel="bill" class="quick-entry-tab bg-blue-600 text-white text-sm px-4 py-1.5">收支</button>
    <button type="button" data-panel="transfer" class="quick-entry-tab text-gray-600 text-sm px-4 py-1.5">转账</button>
    <button type="button" data-panel="debt" class="quick-entry-tab text-gray-600 text-sm px-4 py-1.5">借还</button>
  </div>

  <div data-quick-entry-panel="bill">
    <form method="post" action="/bills" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3">
      <input type="hidden" name="redirect_to" value="{{ quick_redirect_to }}">
      <div><label class="block text-xs text-gray-500 mb-1">类型</label><select id="quick-bill-kind" name="kind" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm bg-white"><option value="expense">支出</option><option value="income">收入</option></select></div>
      <div><label class="block text-xs text-gray-500 mb-1">金额</label><input name="amount" type="number" step="0.01" min="0.01" required class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm font-mono"></div>
      <div><label class="block text-xs text-gray-500 mb-1">账户</label><select name="account_id" required class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm bg-white">{% for a in accounts %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}</select></div>
      <div><label class="block text-xs text-gray-500 mb-1">分类</label><select id="quick-bill-category" name="category" required class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm bg-white">{% for c in categories %}<option value="{{ c.name }}" data-kind="{{ c.kind }}">{{ c.name }}</option>{% endfor %}</select></div>
      <div><label class="block text-xs text-gray-500 mb-1">时间</label><input name="happened_at" type="datetime-local" value="{{ happened_at }}" required class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm"></div>
      <div><label class="block text-xs text-gray-500 mb-1">备注</label><input name="note" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm"></div>
      <div class="lg:col-span-6"><button class="bg-blue-600 text-white text-sm px-4 py-1.5 rounded hover:bg-blue-700">保存收支</button></div>
    </form>
  </div>

  <div data-quick-entry-panel="transfer" class="hidden">
    {% if accounts.len() < 2 || transfer_sources.is_empty() %}
    <p class="text-sm text-amber-700">至少需要两个账户，且转出账户不能是信用卡或信贷服务。</p>
    {% else %}
    <form method="post" action="/transfers" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
      <input type="hidden" name="redirect_to" value="{{ quick_redirect_to }}">
      <div><label class="block text-xs text-gray-500 mb-1">转出账户</label><select name="from_account_id" required class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm bg-white">{% for a in transfer_sources %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}</select><p class="text-xs text-gray-400 mt-1">信用卡和信贷服务不能转出。</p></div>
      <div><label class="block text-xs text-gray-500 mb-1">转入账户</label><select name="to_account_id" required class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm bg-white">{% for a in accounts %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}</select></div>
      <div><label class="block text-xs text-gray-500 mb-1">金额</label><input name="amount" type="number" step="0.01" min="0.01" required class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm font-mono"></div>
      <div><label class="block text-xs text-gray-500 mb-1">时间</label><input name="happened_at" type="datetime-local" value="{{ happened_at }}" required class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm"></div>
      <div class="sm:col-span-2 lg:col-span-4"><label class="block text-xs text-gray-500 mb-1">备注</label><input name="note" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm"></div>
      <div class="sm:col-span-2 lg:col-span-4"><button class="bg-blue-600 text-white text-sm px-4 py-1.5 rounded hover:bg-blue-700">确认转账</button></div>
    </form>
    {% endif %}
  </div>

  <div data-quick-entry-panel="debt" class="hidden">
    <div class="flex justify-end mb-3"><a href="/debt-people" class="text-sm text-blue-600 hover:underline">管理借贷对象</a></div>
    {% if people.is_empty() %}
    <p class="text-sm text-amber-700">空空如也呢，如果要开始使用，请先添加借款人或出借人。</p>
    {% else %}
    <form method="post" action="/debts" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3">
      <input type="hidden" name="redirect_to" value="{{ quick_redirect_to }}">
      <div><label class="block text-xs text-gray-500 mb-1">操作</label><select name="kind" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm bg-white"><option value="lend">我借给对方</option><option value="borrow">我向对方借入</option><option value="repayment_received">对方还给我</option><option value="repayment_paid">我还给对方</option></select></div>
      <div><label class="block text-xs text-gray-500 mb-1">借贷对象</label><select name="person_id" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm bg-white">{% for p in people %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></div>
      <div><label class="block text-xs text-gray-500 mb-1">资金账户</label><select name="account_id" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm bg-white">{% for a in accounts %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}</select></div>
      <div><label class="block text-xs text-gray-500 mb-1">金额</label><input name="amount" type="number" step="0.01" min="0.01" required class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm font-mono"></div>
      <div><label class="block text-xs text-gray-500 mb-1">时间</label><input name="happened_at" type="datetime-local" value="{{ happened_at }}" required class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm"></div>
      <div><label class="block text-xs text-gray-500 mb-1">备注</label><input name="note" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm"></div>
      <div class="lg:col-span-6"><button class="bg-blue-600 text-white text-sm px-4 py-1.5 rounded hover:bg-blue-700">保存借还记录</button></div>
    </form>
    {% endif %}
  </div>
</section>

<script>
(() => {
  const tabs = document.querySelectorAll('.quick-entry-tab');
  const panels = document.querySelectorAll('[data-quick-entry-panel]');
  tabs.forEach(tab => tab.addEventListener('click', () => {
    const activePanel = tab.dataset.panel;
    tabs.forEach(button => {
      const active = button.dataset.panel === activePanel;
      button.classList.toggle('bg-blue-600', active);
      button.classList.toggle('text-white', active);
      button.classList.toggle('text-gray-600', !active);
    });
    panels.forEach(panel => panel.classList.toggle('hidden', panel.dataset.quickEntryPanel !== activePanel));
  }));
})();
(() => {
  const kind = document.getElementById('quick-bill-kind');
  const category = document.getElementById('quick-bill-category');
  if (!kind || !category) return;
  const update = () => {
    let first;
    let selectedVisible = false;
    for (const option of category.options) {
      const visible = option.dataset.kind === kind.value;
      option.hidden = !visible;
      option.disabled = !visible;
      if (visible && !first) first = option;
      if (visible && option.selected) selectedVisible = true;
    }
    if (!selectedVisible && first) first.selected = true;
  };
  kind.addEventListener('change', update);
  update();
})();
</script>
