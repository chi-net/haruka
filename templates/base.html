<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}haruka{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/vendor/htmx.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen" hx-boost="true">
<nav class="bg-white border-b border-gray-200">
  <div class="max-w-6xl mx-auto px-4 h-12 flex items-center gap-4 overflow-x-auto whitespace-nowrap">
    <a href="/" class="font-bold shrink-0">遥 · haruka</a>
    <a href="/dashboard" class="text-sm text-gray-600 hover:text-blue-600">仪表板</a>
    <a href="/bills" class="text-sm text-gray-600 hover:text-blue-600">账单</a>
    <a href="/subscriptions" class="text-sm text-gray-600 hover:text-blue-600">订阅</a>
    <a href="/investments" class="text-sm text-gray-600 hover:text-blue-600">定投</a>
    <a href="/installments" class="text-sm text-gray-600 hover:text-blue-600">分期</a>
    <a href="/accounts" class="text-sm text-gray-600 hover:text-blue-600">账户</a>
    <a href="/statistics" class="text-sm text-gray-600 hover:text-blue-600">统计</a>
    <a href="/currency-converter" class="text-sm text-gray-600 hover:text-blue-600">货币换算</a>
    <a href="/debt-people" class="text-sm text-gray-600 hover:text-blue-600">借贷对象</a>
    <a href="/settings" class="text-sm text-gray-600 hover:text-blue-600">设置</a>
    <form method="post" action="/lock" class="ml-auto shrink-0">
      <button type="submit" class="text-sm text-gray-500 hover:text-blue-600">锁定</button>
    </form>
  </div>
</nav>
<main class="max-w-6xl mx-auto px-4 py-6">
{% block content %}{% endblock %}
</main>
<script>
window.harukaErrorMessage = function(raw, contentType, status) {
  const fallback = `请求失败（HTTP ${status || '未知'}）`;
  if (!raw) return fallback;
  if ((contentType || '').includes('application/json')) {
    try {
      const payload = JSON.parse(raw);
      return payload.error || payload.message || payload.detail || fallback;
    } catch (_) {
      return raw.trim() || fallback;
    }
  }
  if ((contentType || '').includes('text/html')) {
    const document = new DOMParser().parseFromString(raw, 'text/html');
    const detail = document.querySelector('[data-error-detail]');
    return (detail ? detail.textContent : document.body.textContent).trim() || fallback;
  }
  return raw.trim() || fallback;
};

window.harukaReadErrorResponse = async function(response) {
  const raw = await response.text();
  return window.harukaErrorMessage(raw, response.headers.get('content-type') || '', response.status);
};

// Database datetime values are UTC without a suffix. Datetime pickers and
// rendered timestamps always use the visitor's browser timezone.
window.harukaUtcDate = function(value) {
  if (!value) return null;
  const normalized = /(?:Z|[+-]\d\d:\d\d)$/.test(value) ? value : `${value}:00Z`;
  const date = new Date(normalized);
  return Number.isNaN(date.getTime()) ? null : date;
};

window.harukaLocalDateTimeValue = function(date) {
  const pad = value => String(value).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
};

window.harukaUtcDateTimeValue = function(date) {
  const pad = value => String(value).padStart(2, '0');
  return `${date.getUTCFullYear()}-${pad(date.getUTCMonth() + 1)}-${pad(date.getUTCDate())}T${pad(date.getUTCHours())}:${pad(date.getUTCMinutes())}`;
};

window.harukaInitLocalTimes = function(root) {
  const scope = root && root.querySelectorAll ? root : document;
  scope.querySelectorAll('[data-utc-time]').forEach(element => {
    const raw = element.dataset.utcTime;
    const date = window.harukaUtcDate(raw);
    element.textContent = date ? window.harukaLocalDateTimeValue(date).replace('T', ' ') : raw;
    if (date) element.dateTime = date.toISOString();
  });
  scope.querySelectorAll('[data-utc-picker]').forEach(picker => {
    if (picker.dataset.utcPickerReady === 'true') return;
    const field = picker.closest('[data-utc-field]');
    const target = field && field.querySelector('[data-utc-target]');
    if (!target) return;
    const stored = target.value || picker.dataset.utcValue;
    const date = window.harukaUtcDate(stored);
    if (date) picker.value = window.harukaLocalDateTimeValue(date);
    const syncUtc = () => {
      if (!picker.value) {
        target.value = '';
        return;
      }
      const localDate = new Date(picker.value);
      target.value = Number.isNaN(localDate.getTime()) ? '' : window.harukaUtcDateTimeValue(localDate);
    };
    picker.addEventListener('input', syncUtc);
    picker.addEventListener('change', syncUtc);
    picker.dataset.utcPickerReady = 'true';
  });
};

window.harukaShowError = function(message, status) {
  let notice = document.getElementById('haruka-error-notice');
  if (!notice) {
    notice = document.createElement('div');
    notice.id = 'haruka-error-notice';
    notice.className = 'fixed top-4 right-4 z-50 w-[min(24rem,calc(100vw-2rem))] rounded-lg border border-red-300 bg-red-50 p-4 shadow-lg';
    notice.setAttribute('role', 'alert');
    notice.setAttribute('aria-live', 'assertive');
    notice.innerHTML = '<div class="flex items-start gap-3"><div class="min-w-0 flex-1"><p data-error-title class="text-sm font-semibold text-red-800"></p><p data-error-message class="mt-1 whitespace-pre-wrap break-words text-sm text-red-700"></p></div><button type="button" class="shrink-0 text-red-500 hover:text-red-800" aria-label="关闭错误提示">×</button></div>';
    notice.querySelector('button').addEventListener('click', () => notice.remove());
    document.body.appendChild(notice);
  }
  notice.querySelector('[data-error-title]').textContent = status ? `操作失败（HTTP ${status}）` : '操作失败';
  notice.querySelector('[data-error-message]').textContent = message || '请求没有成功，请稍后重试。';
};

document.addEventListener('htmx:responseError', event => {
  const xhr = event.detail.xhr;
  const message = window.harukaErrorMessage(xhr.responseText, xhr.getResponseHeader('content-type') || '', xhr.status);
  window.harukaShowError(message, xhr.status);
});
document.addEventListener('htmx:sendError', () => window.harukaShowError('无法连接服务器，请检查网络或服务是否正在运行。'));
document.addEventListener('htmx:timeout', () => window.harukaShowError('请求超时，请稍后重试。'));
document.addEventListener('DOMContentLoaded', () => window.harukaInitLocalTimes(document));
document.addEventListener('htmx:afterSwap', event => window.harukaInitLocalTimes(event.detail.target));
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(error => console.warn('Service Worker 注册失败', error)));
}
</script>
</body>
</html>
