<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
<title>{% block title %}Haruka{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css?v={{ crate::handlers::stylesheet_version() }}">
<script src="/static/vendor/htmx.min.js"></script>
<script src="/static/vendor/chart.umd.min.js"></script>
<script>
window.harukaColorScheme = window.matchMedia('(prefers-color-scheme: dark)');
window.harukaChartTheme = function() {
  const dark = window.harukaColorScheme.matches;
  return dark
    ? { text: '#d1d5db', grid: 'rgba(148, 163, 184, .18)', tooltip: '#020617', tooltipBorder: '#334155' }
    : { text: '#4b5563', grid: 'rgba(107, 114, 128, .16)', tooltip: '#111827', tooltipBorder: '#374151' };
};
window.harukaApplyChartTheme = function(chart) {
  if (!chart || !chart.canvas || !chart.canvas.isConnected) return;
  const theme = window.harukaChartTheme();
  chart.options.color = theme.text;
  if (chart.options.plugins && chart.options.plugins.legend) {
    chart.options.plugins.legend.labels ||= {};
    chart.options.plugins.legend.labels.color = theme.text;
  }
  if (chart.options.plugins && chart.options.plugins.tooltip) {
    Object.assign(chart.options.plugins.tooltip, {
      backgroundColor: theme.tooltip,
      titleColor: '#f9fafb',
      bodyColor: '#f3f4f6',
      borderColor: theme.tooltipBorder,
      borderWidth: 1
    });
  }
  Object.values(chart.options.scales || {}).forEach(scale => {
    scale.ticks ||= {};
    scale.grid ||= {};
    scale.ticks.color = theme.text;
    scale.grid.color = theme.grid;
    scale.border = { ...(scale.border || {}), color: theme.grid };
  });
  chart.update('none');
};
window.harukaColorScheme.addEventListener('change', () => {
  if (typeof Chart !== 'undefined') Object.values(Chart.instances).forEach(window.harukaApplyChartTheme);
});
document.addEventListener('htmx:beforeCleanupElement', event => {
  const element = event.detail.elt;
  if (element instanceof HTMLCanvasElement && typeof Chart !== 'undefined') Chart.getChart(element)?.destroy();
});
</script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col print:block" hx-boost="true" hx-history="false">
{% block navigation %}
<nav data-site-nav aria-label="主导航" class="sticky top-0 z-30 border-b border-gray-200 bg-white">
  <div class="relative mx-auto flex min-h-14 max-w-6xl items-center gap-3 px-4">
    <a href="/" class="shrink-0 rounded font-bold focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">Haruka</a>
    <div data-nav-desktop class="hidden min-w-0 flex-1 items-center gap-1 lg:flex">
      {% let nav_prefix = "desktop" %}
      {% include "navigation_groups.html" %}
    </div>
    <details data-nav-mobile class="ml-auto lg:hidden">
      <summary id="mobile-navigation-toggle" aria-controls="mobile-navigation-panel" class="flex h-10 cursor-pointer list-none items-center gap-2 rounded-md px-3 text-sm text-gray-600 hover:bg-gray-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">菜单<span aria-hidden="true">▾</span></summary>
      <div id="mobile-navigation-panel" class="absolute inset-x-4 top-full z-40 mt-2 max-h-[80vh] space-y-1 overflow-y-auto rounded-lg border border-gray-200 bg-white p-2 shadow-lg">
        {% let nav_prefix = "mobile" %}
        {% include "navigation_groups.html" %}
      </div>
    </details>
    <a href="/bills/new" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">记一笔</a>
    <form method="post" action="/lock" hx-boost="false" class="shrink-0">
      <button type="submit" class="h-10 rounded-md border border-gray-200 px-3 text-sm text-gray-600 hover:bg-gray-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">锁定</button>
    </form>
  </div>
</nav>
{% endblock %}
<main class="w-full flex-1 max-w-6xl mx-auto px-4 py-6">
{% block content %}{% endblock %}
</main>
{% include "footer.html" %}
{% include "privacy_script.html" %}
<script>
(() => {
  const currentNav = () => document.querySelector('[data-site-nav]');
  let hoverCloseTimer;
  const cancelHoverClose = () => window.clearTimeout(hoverCloseTimer);
  const closeNavigation = nav => {
    cancelHoverClose();
    nav?.querySelectorAll('details[open]').forEach(details => { details.open = false; });
  };
  const updateNavigation = () => {
    const nav = currentNav();
    if (!nav) return;
    const path = window.location.pathname.replace(/\/$/, '') || '/';
    const links = [...nav.querySelectorAll('[data-nav-link]')];
    let activeHref = '';
    links.forEach(link => {
      const href = link.getAttribute('href');
      if ((path === href || path.startsWith(`${href}/`)) && href.length > activeHref.length) activeHref = href;
    });
    links.forEach(link => {
      const active = link.getAttribute('href') === activeHref;
      if (active) link.setAttribute('aria-current', path === activeHref ? 'page' : 'location');
      else link.removeAttribute('aria-current');
      link.classList.toggle('bg-blue-50', active);
    });
    nav.querySelectorAll('[data-nav-section]').forEach(section => {
      const active = !!section.querySelector('[aria-current]');
      const primary = section.querySelector('[data-nav-primary]');
      primary.classList.toggle('text-blue-600', active);
      primary.classList.toggle('text-gray-600', !active);
      primary.classList.toggle('font-semibold', active);
    });
  };
  if (!window.harukaNavigationBound) {
    window.harukaNavigationBound = true;
    const hoverNavigation = window.matchMedia('(min-width: 64rem) and (hover: hover) and (pointer: fine)');
    const desktopSection = event => {
      if (!hoverNavigation.matches || event.pointerType !== 'mouse') return null;
      return event.target.closest('[data-nav-desktop] [data-nav-section]');
    };
    document.addEventListener('pointerover', event => {
      const section = desktopSection(event);
      if (!section) return;
      cancelHoverClose();
      if (event.relatedTarget instanceof Node && section.contains(event.relatedTarget)) return;
      const group = section.querySelector('[data-nav-group]');
      currentNav()?.querySelectorAll('[data-nav-group][open]').forEach(other => {
        if (other !== group && !other.contains(document.activeElement)) other.open = false;
      });
      if (group) group.open = true;
    });
    document.addEventListener('pointerout', event => {
      const section = desktopSection(event);
      if (!section || (event.relatedTarget instanceof Node && section.contains(event.relatedTarget))) return;
      cancelHoverClose();
      // Allow crossing the gap between the trigger and its floating panel.
      hoverCloseTimer = window.setTimeout(() => {
        const group = section.querySelector('[data-nav-group]');
        if (group && !group.contains(document.activeElement)) group.open = false;
      }, 150);
    });
    document.addEventListener('click', event => {
      const nav = currentNav();
      if (!nav) return;
      if (!nav.contains(event.target)) closeNavigation(nav);
      // Keep the tapped link visible until WebKit has dispatched its navigation.
      else if (event.target.closest('a')) window.setTimeout(() => closeNavigation(nav), 0);
    }, true);
    document.addEventListener('focusin', event => {
      const nav = currentNav();
      if (nav && !nav.contains(event.target)) closeNavigation(nav);
    });
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      const nav = currentNav();
      const open = nav?.querySelector('[data-nav-group][open]') || nav?.querySelector('[data-nav-mobile][open]');
      if (!open) return;
      event.preventDefault();
      open.open = false;
      open.querySelector('summary').focus();
    });
    document.addEventListener('toggle', event => {
      const details = event.target;
      if (!details.matches('[data-nav-group]') || !details.open) return;
      currentNav()?.querySelectorAll('[data-nav-group]').forEach(other => {
        if (other !== details) other.open = false;
      });
    }, true);
    window.matchMedia('(min-width: 64rem)').addEventListener('change', () => closeNavigation(currentNav()));
    document.addEventListener('htmx:afterSettle', updateNavigation);
    document.addEventListener('htmx:historyRestore', updateNavigation);
  }
  updateNavigation();
})();

window.harukaErrorMessage = function(raw, contentType, status) {
  const fallback = `请求失败（HTTP ${status || '未知'}）`;
  if (!raw) return fallback;
  if ((contentType || '').includes('application/json')) {
    try {
      const payload = JSON.parse(raw);
      return payload.error || payload.message || payload.detail || fallback;
    } catch (_) {
      return raw.trim() || fallback;
    }
  }
  if ((contentType || '').includes('text/html')) {
    const document = new DOMParser().parseFromString(raw, 'text/html');
    const detail = document.querySelector('[data-error-detail]');
    return (detail ? detail.textContent : document.body.textContent).trim() || fallback;
  }
  return raw.trim() || fallback;
};

window.harukaReadErrorResponse = async function(response) {
  const raw = await response.text();
  return window.harukaErrorMessage(raw, response.headers.get('content-type') || '', response.status);
};

// Stored values remain UTC. Calendar reports use the visitor's IANA timezone;
// without JavaScript they explicitly fall back to UTC.
window.harukaUtcDate = function(value) {
  if (!value) return null;
  const normalized = /(?:Z|[+-]\d\d:\d\d)$/.test(value) ? value : `${value}:00Z`;
  const date = new Date(normalized);
  return Number.isNaN(date.getTime()) ? null : date;
};

window.harukaLocalDateTimeValue = function(date) {
  const pad = value => String(value).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
};

window.harukaDisplayDateTimeValue = function(date) {
  const zone = document.querySelector('[data-business-time-zone]')?.dataset.businessTimeZone
    || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: zone, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  }).formatToParts(date);
  const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
  return `${values.year}-${values.month}-${values.day} ${values.hour}:${values.minute}`;
};

window.harukaSyncTimeZone = function() {
  const zone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
  const cookie = `haruka_time_zone=${encodeURIComponent(zone)}`;
  const changed = !document.cookie.split(';').some(part => part.trim() === cookie);
  if (changed) {
    document.cookie = `${cookie}; Path=/; SameSite=Strict${location.protocol === 'https:' ? '; Secure' : ''}`;
  }
  const reportedZone = document.querySelector('[data-business-time-zone]')?.dataset.businessTimeZone;
  if (changed && reportedZone && reportedZone !== zone
      && !new URL(location.href).searchParams.has('time_zone')) {
    // Reload by GET only; never replay an accounting POST.
    location.replace(location.href);
  }
};

window.harukaUtcDateTimeValue = function(date) {
  const pad = value => String(value).padStart(2, '0');
  return `${date.getUTCFullYear()}-${pad(date.getUTCMonth() + 1)}-${pad(date.getUTCDate())}T${pad(date.getUTCHours())}:${pad(date.getUTCMinutes())}`;
};

window.harukaInitLocalTimes = function(root) {
  const scope = root && root.querySelectorAll ? root : document;
  scope.querySelectorAll('[data-utc-time]').forEach(element => {
    const raw = element.dataset.utcTime;
    const date = window.harukaUtcDate(raw);
    element.textContent = date ? window.harukaDisplayDateTimeValue(date) : raw;
    if (date) element.dateTime = date.toISOString();
  });
  scope.querySelectorAll('[data-utc-picker]').forEach(picker => {
    if (picker.dataset.utcPickerReady === 'true') return;
    const field = picker.closest('[data-utc-field]');
    const target = field && field.querySelector('[data-utc-target]');
    if (!target) return;
    if (picker.name) {
      target.name = picker.name;
      picker.removeAttribute('name');
    }
    const stored = target.value || picker.dataset.utcValue;
    const date = window.harukaUtcDate(stored);
    if (date) picker.value = window.harukaLocalDateTimeValue(date);
    const syncUtc = () => {
      if (!picker.value) {
        target.value = '';
        return;
      }
      const localDate = new Date(picker.value);
      target.value = Number.isNaN(localDate.getTime()) ? '' : window.harukaUtcDateTimeValue(localDate);
    };
    picker.addEventListener('input', syncUtc);
    picker.addEventListener('change', syncUtc);
    picker.dataset.utcPickerReady = 'true';
  });
};

window.harukaShowError = function(message, status) {
  let notice = document.getElementById('haruka-error-notice');
  if (!notice) {
    notice = document.createElement('div');
    notice.id = 'haruka-error-notice';
    notice.className = 'fixed top-4 right-4 z-50 w-[min(24rem,calc(100vw-2rem))] rounded-lg border border-red-300 bg-red-50 p-4 shadow-lg';
    notice.setAttribute('role', 'alert');
    notice.setAttribute('aria-live', 'assertive');
    notice.innerHTML = '<div class="flex items-start gap-3"><div class="min-w-0 flex-1"><p data-error-title class="text-sm font-semibold text-red-800"></p><p data-error-message class="mt-1 whitespace-pre-wrap break-words text-sm text-red-700"></p></div><button type="button" class="shrink-0 text-red-500 hover:text-red-800" aria-label="关闭错误提示">×</button></div>';
    notice.querySelector('button').addEventListener('click', () => notice.remove());
    document.body.appendChild(notice);
  }
  notice.querySelector('[data-error-title]').textContent = status ? `操作失败（HTTP ${status}）` : '操作失败';
  notice.querySelector('[data-error-message]').textContent = message || '请求没有成功，请稍后重试。';
};

document.addEventListener('htmx:responseError', event => {
  const xhr = event.detail.xhr;
  const message = window.harukaErrorMessage(xhr.responseText, xhr.getResponseHeader('content-type') || '', xhr.status);
  window.harukaShowError(message, xhr.status);
});
document.addEventListener('htmx:sendError', () => window.harukaShowError('无法连接服务器，请检查网络或服务是否正在运行。'));
document.addEventListener('htmx:timeout', () => window.harukaShowError('请求超时，请稍后重试。'));
document.addEventListener('DOMContentLoaded', () => {
  window.harukaSyncTimeZone();
  window.harukaInitLocalTimes(document);
});
document.addEventListener('htmx:afterSwap', event => {
  window.harukaSyncTimeZone();
  window.harukaInitLocalTimes(event.detail.target);
});
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(error => console.warn('Service Worker 注册失败', error)));
}
</script>
</body>
</html>
