<script>
(() => {
  const absoluteUrl = path => new URL(path, window.location.origin).href;
  document.querySelectorAll('[data-share-url]').forEach(input => {
    input.value = absoluteUrl(input.dataset.sharePath);
  });
  const fallbackCopy = value => {
    const input = document.createElement('textarea');
    input.value = value;
    input.style.position = 'fixed';
    input.style.opacity = '0';
    document.body.appendChild(input);
    input.select();
    const copied = document.execCommand('copy');
    input.remove();
    if (!copied) throw new Error('浏览器拒绝了复制操作');
  };
  document.querySelectorAll('[data-copy-share]').forEach(button => {
    if (button.dataset.copyReady === 'true') return;
    button.dataset.copyReady = 'true';
    button.addEventListener('click', async () => {
      const value = absoluteUrl(button.dataset.sharePath);
      const original = button.textContent;
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(value);
        else fallbackCopy(value);
        button.textContent = '已复制';
      } catch (error) {
        window.harukaShowError(`复制失败：${error.message}`);
      } finally {
        window.setTimeout(() => { button.textContent = original; }, 1600);
      }
    });
  });
})();
</script>
