{% extends "base.html" %}
{% block title %}安全设置 - haruka{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
  <h1 class="text-xl font-bold mb-4">安全设置</h1>
  <section class="bg-white rounded-lg border border-gray-200 p-4">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 class="font-medium">恢复助记词</h2>
        {% if recovery_configured %}
        <p class="text-sm text-gray-500 mt-1">已设置。出于安全考虑，现有助记词不会再次显示。</p>
        {% else %}
        <p class="text-sm text-amber-700 mt-1">尚未设置。忘记主密码后将无法恢复账目。</p>
        {% endif %}
      </div>
      <form method="post" action="/security/recovery" {% if recovery_configured %}hx-confirm="生成新助记词后，旧助记词将立即失效。继续吗？"{% endif %}>
        <button type="submit" class="whitespace-nowrap bg-blue-600 text-white text-sm px-3 py-1.5 rounded hover:bg-blue-700">
          {% if recovery_configured %}重新生成{% else %}生成助记词{% endif %}
        </button>
      </form>
    </div>
  </section>
</div>
{% endblock %}
