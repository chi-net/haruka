{% extends "public_share_base.html" %}
{% block title %}输入分享密码 - Haruka{% endblock %}
{% block content %}
<section class="bg-white rounded-lg border border-gray-200 p-5">
  <h1 class="text-lg font-semibold">此分享账单受密码保护</h1>
  {% if !error.is_empty() %}<p class="text-sm text-red-600 mt-3" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/s/{{ token }}" class="mt-4 space-y-3">
    <div><label class="block text-sm text-gray-600 mb-1">密码</label><input name="password" type="password" required maxlength="256" autofocus autocomplete="current-password" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
    <button class="w-full bg-blue-600 text-white text-sm px-4 py-2 rounded hover:bg-blue-700">查看账单</button>
  </form>
</section>
{% endblock %}
