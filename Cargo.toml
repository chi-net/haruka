[package]
name = "haruka"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
] }
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
rust_decimal = "1"
askama = "0.12"
